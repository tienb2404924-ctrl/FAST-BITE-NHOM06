<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast Bite - Auth</title>
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <h2>🍔 Fast Bite</h2>

    <div class="tabs">
      <button id="tL" class="active">Đăng nhập</button>
      <button id="tS">Đăng ký</button>
    </div>

    <form>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="pass" placeholder="Mật khẩu" />
      <input
        type="password"
        id="confirm"
        placeholder="Xác nhận mật khẩu"
        style="display: none"
      />

      <button type="button" id="btn">Đăng nhập</button>
      <div id="msg" class="msg"></div>
    </form>

    <p>
      <a href="TrangChu.html" style="color: #666; font-size: 13px"
        >← Quay lại trang chủ</a
      >
    </p>
  </body>
</html>
