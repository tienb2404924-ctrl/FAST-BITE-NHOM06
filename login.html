<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast Bite - Auth</title>
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <h2>🍔 Fast Bite</h2>

    <div type class="tabs">
      <button type="button" id="tL" class="active"
        onclick="switchTab('login')">Đăng
        nhập</button>
      <button type="button" id="tS" onclick="switchTab('signup')">Đăng
        ký</button>
    </div>

    <form id="login-form">
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="pass" placeholder="Mật khẩu" />
      <input
        type="password"
        id="confirm"
        placeholder="Xác nhận mật khẩu"
        style="display: none" />

      <button type="submit" id="btn">Đăng nhập</button>

    </form>

    <p>
      <a href="TrangChu.html" style="color: #666; font-size: 13px">← Quay lại
        trang chủ</a>
    </p>
    <script src="./js/auth.js"></script>
  </body>
</html>
