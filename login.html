<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast Bite - Auth</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="AUTH.js" defer></script>
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <h2>🍔 Fast Bite</h2>

    <div class="tabs">
      <button id="tL" class="active" onclick="switchTab('login')">
        Đăng nhập
      </button>
      <button id="tS" onclick="switchTab('signup')">Đăng ký</button>
    </div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <input type="email" id="email" placeholder="Email" required />
      <input
        type="password"
        id="pass"
        placeholder="Mật khẩu"
        required
        minlength="6"
      />
      <input
        type="password"
        id="confirm"
        placeholder="Xác nhận mật khẩu"
        style="display: none"
      />

      <button type="submit" id="btn">Đăng nhập</button>
      <div id="msg" class="msg"></div>
    </form>

    <p>
      <a href="TrangChu.html" style="color: #666; font-size: 13px"
        >← Quay lại trang chủ</a
      >
    </p>
  </body>
</html>
